[workspace]
resolver = "2"
members = [
    "crates/watcher-core",
    "crates/watcher-proxy",
    "crates/watcher-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
sha2 = "0.10"
rcgen = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
